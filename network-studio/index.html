<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Studio</title>
<meta name="description" content="Design a neural network on a canvas, watch its Python code being written, then edit and run the code in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233047c9'/%3E%3Cpath d='M9 10L23 16M9 22L23 16M9 10L9 22' stroke='white' stroke-width='2'/%3E%3Ccircle cx='9' cy='10' r='3.5' fill='white'/%3E%3Ccircle cx='9' cy='22' r='3.5' fill='white'/%3E%3Ccircle cx='23' cy='16' r='4' fill='%23f2b134'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
/* Where the app loads its helpers from. To host everything yourself, copy the files and change these addresses. */
window.NS_CONFIG = window.NS_CONFIG || {
  pyodide: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/",
  monaco: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs",
  jszip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
  credit: "Built for COG 366: Computational Models of Cognitive Processes, SUNY Oswego."
};
</script>
</head>
<body>
<div class="app" id="app">

  <!-- ============ Top bar ============ -->
  <header class="topbar">
    <div class="brand" title="Network Studio">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="bm-bg"/><path d="M9 10L23 16M9 22L23 16M9 10L9 22" class="bm-line"/><circle cx="9" cy="10" r="3.5" class="bm-dot"/><circle cx="9" cy="22" r="3.5" class="bm-dot"/><circle cx="23" cy="16" r="4" class="bm-out"/></svg>
      <span class="brand-name">Network Studio</span>
    </div>
    <div class="menu-wrap">
      <button class="tb-btn" id="fileBtn" type="button" aria-haspopup="true" aria-expanded="false"><span data-i18n="file">File</span><svg class="ico sm" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
      <div class="menu" id="fileMenu" role="menu" hidden>
        <button role="menuitem" type="button" data-cmd="new"><svg class="ico" viewBox="0 0 20 20"><path d="M5 2h7l4 4v12H5z M12 2v4h4"/></svg><span data-i18n="mNew">New design</span><kbd>Alt+N</kbd></button>
        <button role="menuitem" type="button" data-cmd="open"><svg class="ico" viewBox="0 0 20 20"><path d="M2 6h6l2 2h8v9H2z"/></svg><span data-i18n="mOpen">Open design…</span><kbd>Ctrl+O</kbd></button>
        <button role="menuitem" type="button" data-cmd="save"><svg class="ico" viewBox="0 0 20 20"><path d="M4 3h10l3 3v11H4z M7 3v4h6V3 M7 17v-5h7v5"/></svg><span data-i18n="mSave">Save design (.json)</span><kbd>Ctrl+S</kbd></button>
        <div class="menu-sep"></div>
        <button role="menuitem" type="button" data-cmd="importPy"><svg class="ico" viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M3 16h14"/></svg><span data-i18n="mImportPy">Import Python script…</span></button>
        <div class="menu-sep"></div>
        <button role="menuitem" type="button" data-cmd="templates"><svg class="ico" viewBox="0 0 20 20"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z"/></svg><span data-i18n="mTemplates">Browse templates</span></button>
        <button role="menuitem" type="button" data-cmd="help"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.6a2.3 2.3 0 1 1 3.2 2.1c-.7.3-1 .8-1 1.5v.4M10 14.2v.2"/></svg><span data-i18n="mHelp">Help and shortcuts</span><kbd>?</kbd></button>
      </div>
    </div>
    <div class="tb-sep"></div>
    <button class="tb-icon" id="undoBtn" type="button" data-i18n-title="undo" title="Undo"><svg class="ico" viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
    <button class="tb-icon" id="redoBtn" type="button" data-i18n-title="redo" title="Redo"><svg class="ico" viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M17 9H8a5 5 0 0 0 0 10h2"/></svg></button>
    <div class="tb-sep"></div>
    <label class="title-field"><span class="sr" data-i18n="designName">Design name</span><input id="designTitle" type="text" maxlength="60" spellcheck="false"></label>
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <div class="tb-spacer"></div>
    <div class="seg lang-seg" role="group" aria-label="Language / Idioma">
      <button type="button" id="langEn" aria-pressed="true" title="English">EN</button>
      <button type="button" id="langEs" aria-pressed="false" title="Español">ES</button>
    </div>
    <button class="tb-icon" id="themeBtn" type="button" data-i18n-title="themeToggle" title="Light or dark"><svg class="ico" viewBox="0 0 20 20"><path class="sun" d="M10 3v1.5M10 15.5V17M3 10h1.5M15.5 10H17M5 5l1 1M14 14l1 1M5 15l1-1M14 6l1-1"/><circle class="sun" cx="10" cy="10" r="3.2"/><path class="moon" d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg></button>
    <button class="tb-icon" id="helpBtn" type="button" data-i18n-title="help" title="Help"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.6a2.3 2.3 0 1 1 3.2 2.1c-.7.3-1 .8-1 1.5v.4M10 14.2v.2"/></svg></button>
    <div class="menu-wrap">
      <button class="tb-btn primary" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 20 20"><path d="M10 13V3M6 7l4-4 4 4M3 13v4h14v-4"/></svg><span data-i18n="export">Export</span></button>
      <div class="menu right" id="exportMenu" role="menu" hidden>
        <div class="menu-label" data-i18n="exNetwork">Network</div>
        <button role="menuitem" type="button" data-cmd="exPng"><svg class="ico" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M3 14l4-4 3 3 2-2 5 4"/><circle cx="13.5" cy="7.5" r="1.3"/></svg><span data-i18n="exPng">Image (.png)</span></button>
        <button role="menuitem" type="button" data-cmd="exSvg"><svg class="ico" viewBox="0 0 20 20"><path d="M4 16L10 4l6 12M6.5 11h7"/></svg><span data-i18n="exSvg">Vector image (.svg)</span></button>
        <button role="menuitem" type="button" data-cmd="save"><svg class="ico" viewBox="0 0 20 20"><path d="M7 4c-2 0-2 1.5-2 3s-1 3-2 3c1 0 2 1.5 2 3s0 3 2 3M13 4c2 0 2 1.5 2 3s1 3 2 3c-1 0-2 1.5-2 3s0 3-2 3"/></svg><span data-i18n="exJson">Design file (.json)</span></button>
        <div class="menu-label" data-i18n="exCode">Python code</div>
        <button role="menuitem" type="button" data-cmd="exPyLive"><svg class="ico" viewBox="0 0 20 20"><path d="M7 6L3 10l4 4M13 6l4 4-4 4"/></svg><span data-i18n="exPyLive">Script from the canvas (.py)</span></button>
        <button role="menuitem" type="button" data-cmd="exPyEditor"><svg class="ico" viewBox="0 0 20 20"><path d="M4 16l1-4 8-8 3 3-8 8zM11 6l3 3"/></svg><span data-i18n="exPyEditor">Script from the editor (.py)</span></button>
        <button role="menuitem" type="button" data-cmd="exIpynb"><svg class="ico" viewBox="0 0 20 20"><rect x="4" y="2.5" width="12" height="15" rx="1.5"/><path d="M7 6h6M7 9h6M7 12h4"/></svg><span data-i18n="exIpynb">Jupyter notebook (.ipynb)</span></button>
        <button role="menuitem" type="button" data-cmd="exZip"><svg class="ico" viewBox="0 0 20 20"><path d="M3 5h14v11H3zM3 5l2-2h10l2 2M9 8h2M9 10h2M9 12h2"/></svg><span data-i18n="exZip">VS Code project (.zip)</span></button>
      </div>
    </div>
    <button class="tb-btn code-toggle" id="codeToggle" type="button" aria-pressed="true"><svg class="ico" viewBox="0 0 20 20"><path d="M7 6L3 10l4 4M13 6l4 4-4 4M11 4l-2 12"/></svg><span data-i18n="code">Code</span></button>
  </header>

  <div class="workspace" id="workspace">
    <!-- ============ Left rail ============ -->
    <nav class="rail" aria-label="Panels">
      <button class="rail-btn" type="button" data-panel="elements"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3.2"/><rect x="13.5" y="3.8" width="6.5" height="6.5" rx="1.6"/><circle cx="7" cy="17" r="3.2"/><path d="M13.5 17h7M17 13.5v7"/></svg><span data-i18n="pElements">Elements</span></button>
      <button class="rail-btn" type="button" data-panel="templates"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span data-i18n="pTemplates">Templates</span></button>
      <button class="rail-btn" type="button" data-panel="data"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6M4.5 12v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/></svg><span data-i18n="pData">Data</span></button>
      <button class="rail-btn" type="button" data-panel="training"><svg viewBox="0 0 24 24"><path d="M3.5 19.5h17M5.5 16l4-5.5 3.5 3 5.5-8"/><circle cx="18.5" cy="5.5" r="1.6"/></svg><span data-i18n="rlTraining">Training</span></button>
      <button class="rail-btn" type="button" data-panel="inspect"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5M10.5 8v5M8 10.5h5"/></svg><span data-i18n="rlInspect">Inspect</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" type="button" id="railHelp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.6 2.6 0 1 1 3.6 2.4c-.8.3-1.2.9-1.2 1.7v.5M12 16.6v.3"/></svg><span data-i18n="help">Help</span></button>
    </nav>

    <!-- ============ Flyout panel ============ -->
    <aside class="flyout" id="flyout" hidden>
      <div class="flyout-head"><h2 id="flyoutTitle"></h2><button class="icon-btn" id="flyoutClose" type="button" data-i18n-title="closePanel" title="Close panel"><svg class="ico" viewBox="0 0 20 20"><path d="M12 5l-5 5 5 5"/></svg></button></div>
      <div class="flyout-body" id="flyoutBody"></div>
    </aside>

    <!-- ============ Canvas stage ============ -->
    <main class="stage" id="stage">
      <div class="canvas-host" id="canvasHost" tabindex="0" aria-label="Network canvas">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="application"></svg>
        <textarea id="noteEditor" class="note-editor" hidden spellcheck="true"></textarea>
        <div class="rename-pop" id="renamePop" hidden>
          <label for="renameInput" data-i18n="rename">Rename</label>
          <input id="renameInput" type="text" maxlength="24" spellcheck="false" autocomplete="off">
          <div class="rename-err" id="renameErr"></div>
        </div>
        <div class="ctx-bar" id="ctxBar" hidden></div>
      </div>

      <div class="float stage-top">
        <div class="tools" role="toolbar" aria-label="Tools">
        <button type="button" class="tool" id="toolSelect" aria-pressed="true" data-i18n-title="toolSelect" title="Select (V)"><svg class="ico" viewBox="0 0 20 20"><path d="M5 3l10 6-4.5 1.2L13 15l-2 1-2.5-4.8L5 14z"/></svg></button>
        <button type="button" class="tool" id="toolHand" aria-pressed="false" data-i18n-title="toolHand" title="Move the view (H or hold Space)"><svg class="ico" viewBox="0 0 20 20"><path d="M7 10V4.5a1.2 1.2 0 0 1 2.4 0V9M9.4 9V3.5a1.2 1.2 0 0 1 2.4 0V9M11.8 9V4.5a1.2 1.2 0 0 1 2.4 0V11M14.2 8.5a1.2 1.2 0 0 1 2.4 0V12c0 3-2 5.5-5.2 5.5-2.4 0-3.6-1-4.8-3L4.4 11a1.2 1.2 0 0 1 2-1.3L7 10.5"/></svg></button>
        <span class="tools-sep"></span>
        <button type="button" class="tool" id="toolTidy" data-i18n-title="tidy" title="Tidy up into columns"><svg class="ico" viewBox="0 0 20 20"><path d="M4 4h3v3H4zM4 13h3v3H4zM13 8.5h3v3h-3zM7 5.5l6 4M7 14.5l6-4"/></svg></button>
        <button type="button" class="tool" id="toolValues" aria-pressed="true" data-i18n-title="showValues" title="Show neuron values"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M7.5 10.5l1.8 1.8 3.4-4"/></svg></button>
        <button type="button" class="tool" id="toolSnap" aria-pressed="true" data-i18n-title="snap" title="Snap to grid"><svg class="ico" viewBox="0 0 20 20"><path d="M3 7h14M3 13h14M7 3v14M13 3v14"/></svg></button>
      </div>
        <div class="simbar" id="simbar" role="toolbar" aria-label="Training">
        <button type="button" class="sim-btn primary" id="simRun"><svg class="ico fill" viewBox="0 0 16 16"><path d="M4 2.5l9.5 5.5L4 13.5z"/></svg><span data-i18n="train">Train</span></button>
        <button type="button" class="sim-btn" id="simStep" data-i18n-title="stepTitle" title="Run the next line of the training loop"><svg class="ico" viewBox="0 0 20 20"><path d="M5 4l7 6-7 6M14 4v12"/></svg><span data-i18n="step">Step</span></button>
        <button type="button" class="sim-btn" id="simWalk" data-i18n-title="walkTitle" title="Step through the loop automatically"><svg class="ico" viewBox="0 0 20 20"><path d="M3 4l6 6-6 6M10 4l6 6-6 6"/></svg><span data-i18n="walk">Walk</span></button>
        <button type="button" class="sim-btn icon" id="simReset" data-i18n-title="resetTitle" title="Reset the weights"><svg class="ico" viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 2-4.5M4 3v4h4"/></svg></button>
        <label class="sim-speed"><span class="sr" data-i18n="speed">Speed</span><svg class="ico" viewBox="0 0 20 20"><path d="M3.5 13a6.5 6.5 0 1 1 13 0M10 13l3-4"/></svg><input id="simSpeed" type="range" min="1" max="10" value="5"></label>
        <span class="sim-stat" id="simStat"></span>
      </div>
        <div class="status-wrap"><button type="button" class="status-chip" id="statusChip" aria-expanded="false"></button><div class="issues" id="issues" hidden></div></div>
      </div>

      <section class="float hud" id="hud" aria-label="Results">
        <button type="button" class="hud-head" id="hudToggle" aria-expanded="true">
          <span class="hud-title" data-i18n="results">Results</span>
          <canvas id="hudSpark" width="80" height="22" aria-hidden="true"></canvas>
          <span class="hud-nums" id="hudNums"></span>
          <svg class="ico sm chev" viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>
        </button>
        <div class="hud-body" id="hudBody">
          <div class="hud-cell"><div class="hud-label" data-i18n="lossOverEpochs">Loss over epochs</div><canvas id="lossChart" height="170"></canvas></div>
          <div class="hud-cell" id="hudSide"></div>
        </div>
      </section>

      <div class="float zoom" role="group" aria-label="Zoom">
        <button type="button" id="zoomOut" data-i18n-title="zoomOut" title="Zoom out"><svg class="ico" viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button>
        <button type="button" id="zoomPct" class="zoom-pct" data-i18n-title="zoomReset" title="Back to 100%">100%</button>
        <button type="button" id="zoomIn" data-i18n-title="zoomIn" title="Zoom in"><svg class="ico" viewBox="0 0 20 20"><path d="M5 10h10M10 5v10"/></svg></button>
        <button type="button" id="zoomFit" data-i18n-title="zoomFit" title="Fit to screen (F)"><svg class="ico" viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
      </div>
      <button type="button" class="float show-code" id="showCode" hidden><svg class="ico" viewBox="0 0 20 20"><path d="M7 6L3 10l4 4M13 6l4 4-4 4"/></svg><span data-i18n="showCode">Show code</span></button>
    </main>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="resizeCode" title="Drag to resize the code panel"></div>

    <!-- ============ Code panel ============ -->
    <section class="codepanel" id="codepanel" aria-label="Code">
      <div class="cp-head">
        <div class="cp-tabs" role="tablist">
          <button type="button" role="tab" id="tabLive" aria-selected="true"><span class="live-dot"></span><span data-i18n="liveCode">Live code</span></button>
          <button type="button" role="tab" id="tabEditor" aria-selected="false"><svg class="ico sm" viewBox="0 0 20 20"><path d="M4 16l1-4 8-8 3 3-8 8zM11 6l3 3"/></svg><span data-i18n="editor">Editor</span><span class="dirty-dot" id="editorDirty" hidden></span></button>
        </div>
        <button class="icon-btn" id="codeHide" type="button" data-i18n-title="hideCode" title="Hide the code panel"><svg class="ico" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5"/></svg></button>
      </div>

      <!-- Live code -->
      <div class="cp-pane" id="paneLive">
        <div class="cp-tools">
          <div class="seg small" role="group" data-i18n-aria="codeStyle" aria-label="Code style">
            <button type="button" id="styleNeuron" aria-pressed="true" data-i18n="styleNeuron">Neuron by neuron</button>
            <button type="button" id="styleMatrix" aria-pressed="false" data-i18n="styleMatrix">Matrix</button>
          </div>
          <span class="cp-spacer"></span>
          <button class="btn sm" type="button" id="liveCopy"><svg class="ico sm" viewBox="0 0 20 20"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M13 7V4.5A1.5 1.5 0 0 0 11.5 3h-7A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13H7"/></svg><span data-i18n="copy">Copy</span></button>
          <button class="btn sm" type="button" id="liveToEditor"><svg class="ico sm" viewBox="0 0 20 20"><path d="M4 16l1-4 8-8 3 3-8 8z"/></svg><span data-i18n="openInEditor">Open in editor</span></button>
          <button class="btn sm accent" type="button" id="liveRunPy"><svg class="ico sm fill" viewBox="0 0 16 16"><path d="M4 2.5l9.5 5.5L4 13.5z"/></svg><span data-i18n="runPython">Run in Python</span></button>
        </div>
        <div class="code-view code-theme" id="liveView" tabindex="0" aria-label="Live Python code"></div>
        <div class="cp-meta" id="liveMeta"></div>
        <div class="dock" id="liveDock">
          <div class="dock-tabs" role="tablist">
            <button type="button" role="tab" id="dTabConsole" aria-selected="true" data-i18n="simConsole">Training console</button>
            <button type="button" role="tab" id="dTabVars" aria-selected="false" data-i18n="variables">Variables</button>
          </div>
          <div class="dock-body mono" id="simConsole"></div>
          <div class="dock-body" id="simVars" hidden></div>
        </div>
      </div>

      <!-- Editor -->
      <div class="cp-pane" id="paneEditor" hidden>
        <div class="cp-tools">
          <button class="btn sm accent" type="button" id="edRun" data-i18n-title="runTitle" title="Run (Ctrl+Enter)"><svg class="ico sm fill" viewBox="0 0 16 16"><path d="M4 2.5l9.5 5.5L4 13.5z"/></svg><span data-i18n="run">Run</span></button>
          <button class="btn sm" type="button" id="edStop" disabled><svg class="ico sm fill" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg><span data-i18n="stop">Stop</span></button>
          <button class="btn sm" type="button" id="edCheck" data-i18n-title="checkTitle" title="Compile and look for mistakes without running"><svg class="ico sm" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg><span data-i18n="check">Check</span></button>
          <span class="cp-spacer"></span>
          <button class="icon-btn" type="button" id="edFromCanvas" data-i18n-title="fromCanvas" title="Replace with the code from the canvas"><svg class="ico" viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 2-4.5M4 3v4h4"/></svg></button>
          <button class="icon-btn" type="button" id="edImport" data-i18n-title="importPy" title="Import a .py file"><svg class="ico" viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M3 16h14"/></svg></button>
          <button class="icon-btn" type="button" id="edExport" data-i18n-title="exportPy" title="Download as .py"><svg class="ico" viewBox="0 0 20 20"><path d="M10 13V3M6 7l4-4 4 4M3 16h14"/></svg></button>
          <div class="menu-wrap">
            <button class="icon-btn" type="button" id="edSettingsBtn" data-i18n-title="edSettings" title="Editor settings" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></button>
            <div class="menu right settings-menu" id="edSettings" hidden>
              <label><span data-i18n="codeTheme">Color theme</span>
                <select id="codeThemeSel">
                  <option value="auto" data-i18n="themeAuto">Match the app</option>
                  <option value="dark">Dark+ (VS Code)</option>
                  <option value="light">Light+ (VS Code)</option>
                  <option value="monokai">Monokai</option>
                </select></label>
              <label><span data-i18n="fontSize">Font size</span><input id="fontSizeSel" type="range" min="11" max="20" step="1"></label>
              <label class="check"><input id="wrapSel" type="checkbox"><span data-i18n="wordWrap">Wrap long lines</span></label>
              <label class="check"><input id="minimapSel" type="checkbox"><span data-i18n="minimap">Show minimap</span></label>
            </div>
          </div>
        </div>
        <div class="editor-host code-theme" id="editorHost"></div>
        <div class="cp-meta" id="pyStatus"><span class="py-dot"></span><span id="pyStatusText"></span></div>
        <div class="dock" id="edDock">
          <div class="dock-tabs" role="tablist">
            <button type="button" role="tab" id="dTabOut" aria-selected="true" data-i18n="output">Output</button>
            <button type="button" role="tab" id="dTabProb" aria-selected="false"><span data-i18n="problems">Problems</span> <span class="count" id="probCount" hidden></span></button>
            <span class="cp-spacer"></span>
            <button class="icon-btn sm" type="button" id="outClear" data-i18n-title="clearOutput" title="Clear output"><svg class="ico sm" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M5 15L15 5"/></svg></button>
          </div>
          <div class="dock-body mono" id="pyOut"></div>
          <div class="dock-body" id="pyProblems" hidden></div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- context menu, dialogs, toasts -->
<div class="menu ctx-menu" id="ctxMenu" role="menu" hidden></div>
<div class="modal-back" id="modalBack" hidden></div>
<div class="modal help-modal" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
  <div class="modal-head"><h2 id="helpTitle" data-i18n="helpTitle">Help</h2><button class="icon-btn" type="button" data-close data-i18n-title="close" title="Close"><svg class="ico" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
  <div class="help-grid"><nav class="help-nav" id="helpNav"></nav><article class="help-body" id="helpBody"></article></div>
</div>
<div class="modal confirm-modal" id="confirmModal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
  <h2 id="confirmTitle"></h2><p id="confirmText"></p>
  <div class="modal-actions"><button class="btn" type="button" id="confirmNo"></button><button class="btn accent" type="button" id="confirmYes"></button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="drop-overlay" id="dropOverlay" hidden><div><svg class="ico" viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M3 16h14"/></svg><span data-i18n="dropHere">Drop a design (.json, .png, .svg) or a Python file (.py)</span></div></div>
<input type="file" id="fileDesign" accept=".json,.png,.svg,application/json,image/png,image/svg+xml" hidden>
<input type="file" id="filePy" accept=".py,text/x-python,text/plain" hidden>

<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/pyhl.js"></script>
<script src="js/canvas.js"></script>
<script src="js/python.js"></script>
<script src="js/editor.js"></script>
<script src="js/io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
